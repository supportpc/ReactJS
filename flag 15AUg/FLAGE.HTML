<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>India Flag Mouse Follower</title>

    <style>
        /* =========================================
           INDIA FLAG
        ========================================= */
        .india-wave-flag-horizontal {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: left center;

            filter:
                url(#horizontal-wave) drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.3));

            /* Slower flag animation */
            animation: waveMotion 6s ease-in-out infinite;
        }


        /* =========================================
           SLOW WAVE ANIMATION
        ========================================= */
        @keyframes waveMotion {

            0% {
                transform:
                    perspective(400px) rotateY(0deg) skewY(0deg);
            }

            50% {
                transform:
                    perspective(400px) rotateY(6deg) skewY(2deg);
            }

            100% {
                transform:
                    perspective(400px) rotateY(0deg) skewY(0deg);
            }

        }


        /* =========================================
           MOUSE FOLLOWER
        ========================================= */
        .mouse-follower {
            position: fixed;

            left: 18px;
            top: 18px;

            width: 60px;
            height: 40px;

            z-index: 999999;

            pointer-events: none;

            /*
             * Slower and smoother mouse movement
             */
            transition:
                left 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }


        /* =========================================
           MOBILE HIDE
           Replaces Bootstrap d-none d-md-block
        ========================================= */
        @media (max-width: 767.98px) {

            .mouse-follower {
                display: none !important;
            }

        }
    </style>

</head>


<body>


    <!-- =========================================
         HIDDEN SVG WAVE FILTER
    ========================================= -->

    <svg style="
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        ">

        <filter id="horizontal-wave">

            <feTurbulence type="fractalNoise" baseFrequency="0.04 0.01" numOctaves="2" result="noise">

                <!-- Slower wave -->
                <animate attributeName="baseFrequency" dur="6s" values="
                        0.04 0.01;
                        0.08 0.01;
                        0.04 0.01
                    " repeatCount="indefinite" />

            </feTurbulence>


            <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />

        </filter>

    </svg>


    <!-- =========================================
         MOUSE FOLLOWER
    ========================================= -->

    <div id="mouseFollower" class="mouse-follower">

        <img src="https://flagcdn.com/w80/in.png" alt="India Flag" class="india-wave-flag-horizontal">

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        const mouseFollower =
            document.getElementById("mouseFollower");


        /* =========================================
           MOUSE FOLLOW
        ========================================= */

        window.addEventListener("mousemove", function (e) {

            mouseFollower.style.left =
                (e.clientX + 18) + "px";

            mouseFollower.style.top =
                (e.clientY + 18) + "px";

        });


        /* =========================================
           ESCAPE KEY
        ========================================= */

        document.addEventListener("keydown", function (e) {

            if (e.key === "Escape") {

                console.log("Escape pressed");

            }

        });

    </script>


</body>

</html>
